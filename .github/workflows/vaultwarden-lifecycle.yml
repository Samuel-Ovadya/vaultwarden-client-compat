
name: Vaultwarden Lifecycle

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/vaultwarden-lifecycle.yml"
      - "tests/fixtures/vault-canary.json"

permissions:
  contents: read

concurrency:
  group: vaultwarden-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vaultwarden-lifecycle:
    name: Ephemeral Vaultwarden provisioning lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      VAULTWARDEN_IMAGE: vaultwarden/server:1.37.5
      VAULTWARDEN_CONTAINER: vaultwarden-lifecycle
      VAULTWARDEN_HOST_PORT: "8080"
      VAULTWARDEN_HOSTNAME: vaultwarden.test
      VAULTWARDEN_BASE_URL: https://vaultwarden.test

      BW_CLI_VERSION: "2026.11.0"
      PLAYWRIGHT_VERSION: "1.56.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install --yes \
            ca-certificates \
            curl \
            jq \
            nginx \
            openssl

      - name: Generate temporary test CA and server certificate
        shell: bash
        run: |
          set -Eeuo pipefail

          VAULTWARDEN_TLS_DIR="${RUNNER_TEMP}/vaultwarden-tls"

          mkdir -p "${VAULTWARDEN_TLS_DIR}"
          chmod 700 "${VAULTWARDEN_TLS_DIR}"

          # Generate a temporary local CA.
          openssl req \
            -x509 \
            -newkey rsa:2048 \
            -sha256 \
            -days 1 \
            -nodes \
            -keyout "${VAULTWARDEN_TLS_DIR}/ca.key" \
            -out "${VAULTWARDEN_TLS_DIR}/ca.crt" \
            -subj "/CN=Vaultwarden Lifecycle Test CA"

          # Generate the server private key and certificate request.
          openssl req \
            -new \
            -newkey rsa:2048 \
            -sha256 \
            -nodes \
            -keyout "${VAULTWARDEN_TLS_DIR}/server.key" \
            -out "${VAULTWARDEN_TLS_DIR}/server.csr" \
            -subj "/CN=${VAULTWARDEN_HOSTNAME}"

          # Add the DNS subject alternative name.
          cat > "${VAULTWARDEN_TLS_DIR}/server.ext" <<EOF
          subjectAltName=DNS:${VAULTWARDEN_HOSTNAME}
          extendedKeyUsage=serverAuth
          keyUsage=digitalSignature,keyEncipherment
          EOF

          # Sign the server certificate using the temporary CA.
          openssl x509 \
            -req \
            -in "${VAULTWARDEN_TLS_DIR}/server.csr" \
            -CA "${VAULTWARDEN_TLS_DIR}/ca.crt" \
            -CAkey "${VAULTWARDEN_TLS_DIR}/ca.key" \
            -CAcreateserial \
            -out "${VAULTWARDEN_TLS_DIR}/server.crt" \
            -days 1 \
            -sha256 \
            -extfile "${VAULTWARDEN_TLS_DIR}/server.ext"

          chmod 600 "${VAULTWARDEN_TLS_DIR}/"*.key

          # Install the temporary CA into the runner's system trust store.
          sudo cp \
            "${VAULTWARDEN_TLS_DIR}/ca.crt" \
            /usr/local/share/ca-certificates/vaultwarden-lifecycle-ca.crt

          sudo update-ca-certificates

          # Resolve the test hostname to loopback.
          echo "127.0.0.1 ${VAULTWARDEN_HOSTNAME}" | sudo tee -a /etc/hosts

      - name: Configure Nginx HTTPS reverse proxy
        shell: bash
        run: |
          set -Eeuo pipefail

          VAULTWARDEN_TLS_DIR="${RUNNER_TEMP}/vaultwarden-tls"

          sudo tee /etc/nginx/sites-available/vaultwarden-lifecycle > /dev/null <<EOF
          server {
              listen 127.0.0.1:443 ssl;
              server_name ${VAULTWARDEN_HOSTNAME};

              ssl_certificate ${VAULTWARDEN_TLS_DIR}/server.crt;
              ssl_certificate_key ${VAULTWARDEN_TLS_DIR}/server.key;
              ssl_protocols TLSv1.2 TLSv1.3;

              location / {
                  proxy_pass http://127.0.0.1:${VAULTWARDEN_HOST_PORT};
                  proxy_http_version 1.1;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
          EOF

          sudo ln -s \
            /etc/nginx/sites-available/vaultwarden-lifecycle \
            /etc/nginx/sites-enabled/vaultwarden-lifecycle

          sudo rm -f /etc/nginx/sites-enabled/default

          sudo nginx -t
          sudo systemctl restart nginx

      - name: Start ephemeral Vaultwarden
        shell: bash
        run: |
          set -Eeuo pipefail

          docker pull "${VAULTWARDEN_IMAGE}"

          docker run --detach \
            --name "${VAULTWARDEN_CONTAINER}" \
            --publish "127.0.0.1:${VAULTWARDEN_HOST_PORT}:80" \
            --tmpfs /data:rw,nosuid,nodev,noexec,size=128m \
            --env DOMAIN="${VAULTWARDEN_BASE_URL}" \
            --env SIGNUPS_ALLOWED=true \
            --env SIGNUPS_VERIFY=false \
            "${VAULTWARDEN_IMAGE}"

      - name: Verify Vaultwarden HTTPS endpoint
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Waiting for Vaultwarden HTTPS endpoint..."

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              "${VAULTWARDEN_BASE_URL}/alive"; then
              echo
              break
            fi

            if [ "${attempt}" -eq 30 ]; then
              echo "Vaultwarden did not become healthy in time."
              exit 1
            fi

            sleep 2
          done

          echo "Checking TLS certificate and hostname..."

          openssl s_client \
            -connect 127.0.0.1:443 \
            -servername "${VAULTWARDEN_HOSTNAME}" \
            -verify_return_error \
            -verify_hostname "${VAULTWARDEN_HOSTNAME}" \
            </dev/null

          echo "Checking HTTPS response..."

          HTTP_STATUS="$(curl \
            --silent \
            --output /dev/null \
            --write-out '%{http_code}' \
            "${VAULTWARDEN_BASE_URL}/alive")"

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "Unexpected HTTP status: ${HTTP_STATUS}"
            exit 1
          fi

          echo "Vaultwarden HTTPS endpoint is healthy."

      - name: Verify Web Vault and API availability
        shell: bash
        run: |
          set -Eeuo pipefail

          # The official Web Vault must be served by Vaultwarden.
          WEB_STATUS="$(curl \
            --silent \
            --output /dev/null \
            --write-out '%{http_code}' \
            "${VAULTWARDEN_BASE_URL}/")"

          if [ "${WEB_STATUS}" != "200" ]; then
            echo "Web Vault is unavailable: HTTP ${WEB_STATUS}"
            exit 1
          fi

          API_STATUS="$(curl \
            --silent \
            --output /dev/null \
            --write-out '%{http_code}' \
            "${VAULTWARDEN_BASE_URL}/api/config")"

          if [ "${API_STATUS}" != "200" ]; then
            echo "Vaultwarden API is unavailable: HTTP ${API_STATUS}"
            exit 1
          fi

          echo "Web Vault and API are available."

      - name: Generate disposable account credentials
        shell: bash
        run: |
          set -Eeuo pipefail

          # Credentials exist only on this GitHub-hosted runner.
          BW_EMAIL="canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 4)@example.invalid"
          BW_PASSWORD="Aa1!$(openssl rand -hex 24)"

          # Prevent accidental disclosure in GitHub Actions logs.
          echo "::add-mask::${BW_EMAIL}"
          echo "::add-mask::${BW_PASSWORD}"

          {
            echo "BW_EMAIL=${BW_EMAIL}"
            echo "BW_PASSWORD=${BW_PASSWORD}"
          } >> "${GITHUB_ENV}"

          echo "Disposable account credentials generated."

      - name: Install pinned provisioning tools
        shell: bash
        run: |
          set -Eeuo pipefail

          PROVISIONING_DIR="${RUNNER_TEMP}/vaultwarden-provisioning"

          mkdir -p "${PROVISIONING_DIR}"

          # Install exact versions of the official CLI and Playwright.
          npm install \
            --prefix "${PROVISIONING_DIR}" \
            --no-save \
            "@bitwarden/cli@${BW_CLI_VERSION}" \
            "playwright@${PLAYWRIGHT_VERSION}"

          BW_BIN="${PROVISIONING_DIR}/node_modules/.bin/bw"

          echo "Installed Bitwarden CLI version:"
          "${BW_BIN}" --version

          echo "Installing Chromium and its system dependencies..."

          "${PROVISIONING_DIR}/node_modules/.bin/playwright" \
            install --with-deps chromium

      - name: Register disposable account through Web Vault
        shell: bash
        run: |
          set -Eeuo pipefail

          PROVISIONING_DIR="${RUNNER_TEMP}/vaultwarden-provisioning"

          export BROWSER_PROFILE_DIR="${RUNNER_TEMP}/vaultwarden-browser-profile"

          cat > "${PROVISIONING_DIR}/register.mjs" <<'EOF'
          import { chromium } from 'playwright';

          const baseUrl = process.env.VAULTWARDEN_BASE_URL;
          const email = process.env.BW_EMAIL;
          const password = process.env.BW_PASSWORD;
          const profileDir = process.env.BROWSER_PROFILE_DIR;

          if (!baseUrl || !email || !password || !profileDir) {
            throw new Error('Missing registration configuration.');
          }

          const context = await chromium.launchPersistentContext(
            profileDir,
            {
              headless: true
            }
          );

          try {
            const page = await context.newPage();

            console.log('Opening official Bitwarden Web Vault...');

            await page.goto(`${baseUrl}/#/register`, {
              waitUntil: 'domcontentloaded'
            });

            // Wait for the registration interface.
            const emailInput = page.locator(
              'input[type="email"], input[autocomplete="email"]'
            ).first();

            const passwordInputs = page.locator(
              'input[type="password"]'
            );

            await emailInput.waitFor({
              state: 'visible',
              timeout: 30000
            });

            if (await passwordInputs.count() < 2) {
              throw new Error(
                'Expected registration password and confirmation inputs.'
              );
            }

            await emailInput.fill(email);
            await passwordInputs.nth(0).fill(password);
            await passwordInputs.nth(1).fill(password);

            // Observe the actual registration API response.
            const registrationResponsePromise = page.waitForResponse(
              response =>
                new URL(response.url()).pathname.endsWith(
                  '/api/accounts/register'
                ) &&
                response.request().method() === 'POST',
              { timeout: 60000 }
            );

            const submitButton = page.locator(
              'button[type="submit"]'
            ).last();

            await submitButton.click();

            const registrationResponse =
              await registrationResponsePromise;

            if (!registrationResponse.ok()) {
              throw new Error(
                `Account registration failed: HTTP ${registrationResponse.status()}`
              );
            }

            console.log(
              'Disposable account successfully registered through Web Vault.'
            );

          } finally {
            await context.close();
          }
          EOF

          node "${PROVISIONING_DIR}/register.mjs"

      - name: Authenticate and import canary vault using Bitwarden CLI
        shell: bash
        run: |
          set -Eeuo pipefail

          PROVISIONING_DIR="${RUNNER_TEMP}/vaultwarden-provisioning"
          BW_BIN="${PROVISIONING_DIR}/node_modules/.bin/bw"

          export BITWARDENCLI_APPDATA_DIR="${RUNNER_TEMP}/vaultwarden-cli"

          mkdir -p "${BITWARDENCLI_APPDATA_DIR}"

          # Configure the official CLI for the temporary Vaultwarden server.
          "${BW_BIN}" config server "${VAULTWARDEN_BASE_URL}"

          # Authenticate without placing the master password in process arguments.
          BW_SESSION="$("${BW_BIN}" login \
            "${BW_EMAIL}" \
            --passwordenv BW_PASSWORD \
            --nointeraction \
            --raw)"

          if [ -z "${BW_SESSION}" ]; then
            echo "Bitwarden CLI authentication did not return a session."
            exit 1
          fi

          echo "::add-mask::${BW_SESSION}"

          export BW_SESSION

          # Confirm that the CLI is authenticated and unlocked.
          STATUS="$("${BW_BIN}" status --raw)"

          if ! echo "${STATUS}" | jq -e '.status == "unlocked"' > /dev/null; then
            echo "Bitwarden CLI is not unlocked."
            exit 1
          fi

          # Import the existing repository fixture.
          CANARY_FIXTURE="${GITHUB_WORKSPACE}/tests/fixtures/vault-canary.json"

          if [ ! -f "${CANARY_FIXTURE}" ]; then
            echo "Canary fixture not found: ${CANARY_FIXTURE}"
            exit 1
          fi

          echo "Importing canary vault through the official Bitwarden CLI..."

          "${BW_BIN}" import bitwardenjson "${CANARY_FIXTURE}"

          # Pull the resulting vault state from the server.
          "${BW_BIN}" sync

          echo "Canary vault import completed."

      - name: Verify imported canary vault
        shell: bash
        run: |
          set -Eeuo pipefail

          PROVISIONING_DIR="${RUNNER_TEMP}/vaultwarden-provisioning"
          BW_BIN="${PROVISIONING_DIR}/node_modules/.bin/bw"

          export BITWARDENCLI_APPDATA_DIR="${RUNNER_TEMP}/vaultwarden-cli"

          ITEMS_FILE="${RUNNER_TEMP}/canary-items.json"
          FOLDERS_FILE="${RUNNER_TEMP}/canary-folders.json"

          # Retrieve and decrypt the vault using the official CLI.
          "${BW_BIN}" list items --raw > "${ITEMS_FILE}"
          "${BW_BIN}" list folders --raw > "${FOLDERS_FILE}"

          echo "Checking item counts and types..."

          jq -e '
            length == 4 and
            ([.[] | select(.type == 1)] | length) == 1 and
            ([.[] | select(.type == 2)] | length) == 1 and
            ([.[] | select(.type == 3)] | length) == 1 and
            ([.[] | select(.type == 4)] | length) == 1
          ' "${ITEMS_FILE}" > /dev/null

          echo "Checking expected item names..."

          jq -e '
            ([.[].name] | sort) == [
              "Canary Identity",
              "Canary Login",
              "Canary Payment Card",
              "Canary Secure Note"
            ]
          ' "${ITEMS_FILE}" > /dev/null

          echo "Checking folder..."

          jq -e '
            length == 1 and
            any(.[]; .name == "Compatibility Test Folder")
          ' "${FOLDERS_FILE}" > /dev/null

          FOLDER_ID="$(jq -r '
            .[] |
            select(.name == "Compatibility Test Folder") |
            .id
          ' "${FOLDERS_FILE}")"

          if [ -z "${FOLDER_ID}" ] || [ "${FOLDER_ID}" = "null" ]; then
            echo "Expected folder was not imported."
            exit 1
          fi

          echo "Checking folder assignments..."

          jq -e --arg folder_id "${FOLDER_ID}" '
            length == 4 and
            all(.[]; .folderId == $folder_id)
          ' "${ITEMS_FILE}" > /dev/null

          echo "Checking imported item contents..."

          jq -e '
            any(.[]; 
              .name == "Canary Login" and
              .type == 1 and
              .favorite == true and
              .login.username == "canary-user" and
              .login.password == "Synthetic-Password-123!" and
              .login.totp != null
            ) and

            any(.[]; 
              .name == "Canary Secure Note" and
              .type == 2 and
              (.notes | contains("\n"))
            ) and

            any(.[]; 
              .name == "Canary Payment Card" and
              .type == 3 and
              .card.number == "4111111111111111"
            ) and

            any(.[]; 
              .name == "Canary Identity" and
              .type == 4 and
              .identity.email == "canary@example.invalid"
            )
          ' "${ITEMS_FILE}" > /dev/null

          echo "All canary vault verification checks passed."

          echo "Verified:"
          echo "- 1 Login"
          echo "- 1 Secure Note"
          echo "- 1 Payment Card"
          echo "- 1 Identity"
          echo "- 1 Folder"
          echo "- All four folder assignments"
          echo "- Selected decrypted item contents"

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          DIAGNOSTICS_DIR="${RUNNER_TEMP}/vaultwarden-lifecycle"

          mkdir -p "${DIAGNOSTICS_DIR}"

          docker ps -a \
            > "${DIAGNOSTICS_DIR}/docker-ps.txt" 2>&1

          docker logs "${VAULTWARDEN_CONTAINER}" \
            > "${DIAGNOSTICS_DIR}/vaultwarden.log" 2>&1

          sudo nginx -T \
            > "${DIAGNOSTICS_DIR}/nginx-config.txt" 2>&1

          sudo journalctl -u nginx --no-pager \
            > "${DIAGNOSTICS_DIR}/nginx-journal.txt" 2>&1

          curl -v \
            "${VAULTWARDEN_BASE_URL}/alive" \
            > "${DIAGNOSTICS_DIR}/https-alive.txt" 2>&1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vaultwarden-lifecycle-diagnostics
          path: ${{ runner.temp }}/vaultwarden-lifecycle/
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup ephemeral environment
        if: always()
        shell: bash
        run: |
          set +e

          VAULTWARDEN_TLS_DIR="${RUNNER_TEMP}/vaultwarden-tls"
          DIAGNOSTICS_DIR="${RUNNER_TEMP}/vaultwarden-lifecycle"

          # Remove the temporary server and its in-memory database.
          docker rm --force "${VAULTWARDEN_CONTAINER}" 2>/dev/null

          # Stop Nginx.
          sudo systemctl stop nginx 2>/dev/null

          # Remove temporary Nginx configuration.
          sudo rm -f \
            /etc/nginx/sites-enabled/vaultwarden-lifecycle \
            /etc/nginx/sites-available/vaultwarden-lifecycle

          # Remove the temporary CA from the system trust store.
          sudo rm -f \
            /usr/local/share/ca-certificates/vaultwarden-lifecycle-ca.crt

          sudo update-ca-certificates

          # Remove the temporary hostname entry.
          sudo sed -i \
            "/${VAULTWARDEN_HOSTNAME//./\\.}/d" \
            /etc/hosts

          # Remove all client profiles, credentials-related state and certificates.
          rm -rf "${VAULTWARDEN_TLS_DIR}"
          rm -rf "${RUNNER_TEMP}/vaultwarden-cli"
          rm -rf "${RUNNER_TEMP}/vaultwarden-browser-profile"
          rm -rf "${RUNNER_TEMP}/vaultwarden-provisioning"

          # Remove local verification data.
          rm -f \
            "${RUNNER_TEMP}/canary-items.json" \
            "${RUNNER_TEMP}/canary-folders.json"

          rm -rf "${DIAGNOSTICS_DIR}"

          echo "Temporary Vaultwarden environment cleaned up."
