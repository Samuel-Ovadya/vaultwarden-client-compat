
name: Vaultwarden Lifecycle

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/vaultwarden-lifecycle.yml"

permissions:
  contents: read

concurrency:
  group: vaultwarden-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vaultwarden-lifecycle:
    name: Ephemeral Vaultwarden + upstream BIT
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      VAULTWARDEN_IMAGE: vaultwarden/server:1.37.5
      VAULTWARDEN_CONTAINER: vaultwarden-lifecycle
      VAULTWARDEN_HOST_PORT: "8080"
      VAULTWARDEN_HOSTNAME: vaultwarden.test
      VAULTWARDEN_BASE_URL: https://vaultwarden.test

      BW_CLI_VERSION: "2026.11.0"

      BIT_REPOSITORY: https://github.com/bitwarden/browser-interactions-testing.git
      BIT_BRANCH: main

    steps:
      - name: Checkout compatibility repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install system dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install --yes \
            ca-certificates \
            curl \
            jq \
            libnss3-tools \
            nginx \
            openssl \
            unzip

      - name: Clone latest upstream BIT
        shell: bash
        run: |
          set -Eeuo pipefail

          BIT_DIR="${RUNNER_TEMP}/browser-interactions-testing"

          git clone \
            --depth 1 \
            --branch "${BIT_BRANCH}" \
            "${BIT_REPOSITORY}" \
            "${BIT_DIR}"

          BIT_COMMIT="$(git -C "${BIT_DIR}" rev-parse HEAD)"

          echo "BIT_DIR=${BIT_DIR}" >> "${GITHUB_ENV}"
          echo "BIT_COMMIT=${BIT_COMMIT}" >> "${GITHUB_ENV}"

          {
            echo "### Upstream BIT revision"
            echo
            echo "- Repository: ${BIT_REPOSITORY}"
            echo "- Branch: ${BIT_BRANCH}"
            echo "- Commit: ${BIT_COMMIT}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Generate temporary test CA and server certificate
        shell: bash
        run: |
          set -Eeuo pipefail

          VAULTWARDEN_TLS_DIR="${RUNNER_TEMP}/vaultwarden-tls"
          NSS_DB="${HOME}/.pki/nssdb"

          mkdir -p "${VAULTWARDEN_TLS_DIR}"
          chmod 700 "${VAULTWARDEN_TLS_DIR}"

          # Generate temporary local CA.
          openssl req \
            -x509 \
            -newkey rsa:2048 \
            -sha256 \
            -days 1 \
            -nodes \
            -keyout "${VAULTWARDEN_TLS_DIR}/ca.key" \
            -out "${VAULTWARDEN_TLS_DIR}/ca.crt" \
            -subj "/CN=Vaultwarden Lifecycle Test CA"

          # Generate server key and certificate request.
          openssl req \
            -new \
            -newkey rsa:2048 \
            -sha256 \
            -nodes \
            -keyout "${VAULTWARDEN_TLS_DIR}/server.key" \
            -out "${VAULTWARDEN_TLS_DIR}/server.csr" \
            -subj "/CN=${VAULTWARDEN_HOSTNAME}"

          # Include Vaultwarden and local BIT test hostnames.
          cat > "${VAULTWARDEN_TLS_DIR}/server.ext" <<EOF
          subjectAltName=DNS:${VAULTWARDEN_HOSTNAME},DNS:*.test,DNS:localhost,IP:127.0.0.1
          extendedKeyUsage=serverAuth
          keyUsage=digitalSignature,keyEncipherment
          EOF

          openssl x509 \
            -req \
            -in "${VAULTWARDEN_TLS_DIR}/server.csr" \
            -CA "${VAULTWARDEN_TLS_DIR}/ca.crt" \
            -CAkey "${VAULTWARDEN_TLS_DIR}/ca.key" \
            -CAcreateserial \
            -out "${VAULTWARDEN_TLS_DIR}/server.crt" \
            -days 1 \
            -sha256 \
            -extfile "${VAULTWARDEN_TLS_DIR}/server.ext"

          chmod 600 "${VAULTWARDEN_TLS_DIR}/"*.key

          # Install CA into system trust.
          sudo cp \
            "${VAULTWARDEN_TLS_DIR}/ca.crt" \
            /usr/local/share/ca-certificates/vaultwarden-lifecycle-ca.crt

          sudo update-ca-certificates

          # Install CA into Chromium's NSS database.
          mkdir -p "${NSS_DB}"

          if [ ! -f "${NSS_DB}/cert9.db" ]; then
            certutil -d "sql:${NSS_DB}" -N --empty-password
          fi

          certutil \
            -d "sql:${NSS_DB}" \
            -A \
            -t "CP,CP," \
            -n "Vaultwarden Lifecycle Test CA" \
            -i "${VAULTWARDEN_TLS_DIR}/ca.crt"

          certutil -d "sql:${NSS_DB}" -L |
            grep -F "Vaultwarden Lifecycle Test CA"

          # Resolve Vaultwarden hostname locally.
          echo "127.0.0.1 ${VAULTWARDEN_HOSTNAME}" |
            sudo tee -a /etc/hosts

          # BIT's test-site API uses these certificate filenames.
          cp "${VAULTWARDEN_TLS_DIR}/server.crt" "${RUNNER_TEMP}/ssl.crt"
          cp "${VAULTWARDEN_TLS_DIR}/server.key" "${RUNNER_TEMP}/ssl.key"

      - name: Configure Nginx HTTPS reverse proxy
        shell: bash
        run: |
          set -Eeuo pipefail

          VAULTWARDEN_TLS_DIR="${RUNNER_TEMP}/vaultwarden-tls"

          sudo tee /etc/nginx/sites-available/vaultwarden-lifecycle > /dev/null <<EOF
          server {
              listen 127.0.0.1:443 ssl;
              server_name ${VAULTWARDEN_HOSTNAME};

              ssl_certificate ${VAULTWARDEN_TLS_DIR}/server.crt;
              ssl_certificate_key ${VAULTWARDEN_TLS_DIR}/server.key;
              ssl_protocols TLSv1.2 TLSv1.3;

              location / {
                  proxy_pass http://127.0.0.1:${VAULTWARDEN_HOST_PORT};
                  proxy_http_version 1.1;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
          EOF

          sudo ln -s \
            /etc/nginx/sites-available/vaultwarden-lifecycle \
            /etc/nginx/sites-enabled/vaultwarden-lifecycle

          sudo rm -f /etc/nginx/sites-enabled/default

          sudo nginx -t
          sudo systemctl restart nginx

      - name: Start ephemeral Vaultwarden
        shell: bash
        run: |
          set -Eeuo pipefail

          docker pull "${VAULTWARDEN_IMAGE}"

          docker run --detach \
            --name "${VAULTWARDEN_CONTAINER}" \
            --publish "127.0.0.1:${VAULTWARDEN_HOST_PORT}:80" \
            --tmpfs /data:rw,nosuid,nodev,noexec,size=128m \
            --env DOMAIN="${VAULTWARDEN_BASE_URL}" \
            --env SIGNUPS_ALLOWED=true \
            --env SIGNUPS_VERIFY=false \
            "${VAULTWARDEN_IMAGE}"

      - name: Verify Vaultwarden HTTPS endpoint
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Waiting for Vaultwarden..."

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              "${VAULTWARDEN_BASE_URL}/alive"; then
              echo
              break
            fi

            if [ "${attempt}" -eq 30 ]; then
              echo "Vaultwarden did not become healthy."
              exit 1
            fi

            sleep 2
          done

          openssl s_client \
            -connect 127.0.0.1:443 \
            -servername "${VAULTWARDEN_HOSTNAME}" \
            -verify_return_error \
            -verify_hostname "${VAULTWARDEN_HOSTNAME}" \
            </dev/null

          HTTP_STATUS="$(curl \
            --silent \
            --output /dev/null \
            --write-out '%{http_code}' \
            "${VAULTWARDEN_BASE_URL}/alive")"

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "Unexpected /alive status: ${HTTP_STATUS}"
            exit 1
          fi

      - name: Verify Web Vault and API
        shell: bash
        run: |
          set -Eeuo pipefail

          WEB_STATUS="$(curl \
            --silent \
            --output /dev/null \
            --write-out '%{http_code}' \
            "${VAULTWARDEN_BASE_URL}/")"

          API_STATUS="$(curl \
            --silent \
            --output /dev/null \
            --write-out '%{http_code}' \
            "${VAULTWARDEN_BASE_URL}/api/config")"

          if [ "${WEB_STATUS}" != "200" ]; then
            echo "Web Vault unavailable: HTTP ${WEB_STATUS}"
            exit 1
          fi

          if [ "${API_STATUS}" != "200" ]; then
            echo "Vaultwarden API unavailable: HTTP ${API_STATUS}"
            exit 1
          fi

          echo "Vaultwarden is ready."

      - name: Generate disposable BIT account credentials
        shell: bash
        run: |
          set -Eeuo pipefail

          VAULT_EMAIL="bit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 4)@example.invalid"
          VAULT_PASSWORD="Aa1!$(openssl rand -hex 24)"

          echo "::add-mask::${VAULT_EMAIL}"
          echo "::add-mask::${VAULT_PASSWORD}"

          {
            echo "VAULT_EMAIL=${VAULT_EMAIL}"
            echo "VAULT_PASSWORD=${VAULT_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Configure BIT environment
        working-directory: ${{ env.BIT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cp .env.example .env

          # Update the upstream environment template.
          # Other upstream defaults are preserved.
          node <<'NODE'
          const fs = require("node:fs");

          const file = ".env";
          const lines = fs.readFileSync(file, "utf8").split(/\r?\n/);

          const values = {
            BW_DOMAIN: process.env.VAULTWARDEN_HOSTNAME,
            BW_ENABLE_SSL: "true",
            BW_SSL_CERT: "ssl.crt",
            BW_SSL_KEY: "ssl.key",
            CI: "true",
            EXTENSION_BUILD_PATH: "build",
            REMOTE_VAULT_CONFIG_MATCH:
              `${process.env.VAULTWARDEN_BASE_URL}/api/config`,
            VAULT_EMAIL: process.env.VAULT_EMAIL,
            VAULT_PASSWORD: process.env.VAULT_PASSWORD,
            VAULT_HOST_URL: process.env.VAULTWARDEN_BASE_URL,
            VAULT_HOST_PORT: "443",
            VAULT_HOST_INSECURE_PORT: "80",
          };

          const updated = new Set();

          const output = lines.map((line) => {
            if (!line || line.trimStart().startsWith("#")) {
              return line;
            }

            const match = line.match(/^([A-Za-z_][A-Za-z0-9_]*)=/);

            if (!match || !(match[1] in values)) {
              return line;
            }

            const key = match[1];
            updated.add(key);

            return `${key}=${JSON.stringify(values[key])}`;
          });

          for (const [key, value] of Object.entries(values)) {
            if (!updated.has(key)) {
              output.push(`${key}=${JSON.stringify(value)}`);
            }
          }

          fs.writeFileSync(file, output.join("\n"));
          NODE

          # Use the same certificate for BIT's test-site API.
          cp "${RUNNER_TEMP}/ssl.crt" ssl.crt
          cp "${RUNNER_TEMP}/ssl.key" ssl.key

          echo "BIT configured to target ${VAULTWARDEN_BASE_URL}."

      - name: Install Bitwarden CLI
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install --global "@bitwarden/cli@${BW_CLI_VERSION}"

          bw --version

      - name: Install BIT dependencies and Chromium
        working-directory: ${{ env.BIT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          npm ci

          npx playwright install --with-deps chromium

      - name: Download official Bitwarden browser extension build
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build-browser.yml
          workflow_conclusion: ""
          branch: main
          name: ^dist-chrome-MV3-\w{7}\.zip$
          name_is_regexp: true
          repo: bitwarden/clients
          if_no_artifact_found: fail
          skip_unpack: true

      - name: Unpack browser extension build
        working-directory: ${{ env.BIT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # The downloaded artifact contains the extension ZIP.
          unzip -o "${GITHUB_WORKSPACE}"/*dist-chrome*.zip.zip

          mkdir -p build
          unzip -o dist-chrome*.zip -d build

          if [ -z "$(find build -mindepth 1 -print -quit)" ]; then
            echo "Browser extension build is empty."
            exit 1
          fi

      - name: Download upstream BIT test-site build
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          workflow_conclusion: ""
          branch: main
          name: build-files
          path: ${{ runner.temp }}/browser-interactions-testing/test-site
          repo: bitwarden/test-the-web
          if_no_artifact_found: fail

      - name: Install BIT test-site dependencies
        working-directory: ${{ env.BIT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -d test-site ]; then
            echo "BIT test-site artifact is missing."
            exit 1
          fi

          mkdir -p test-site/api

          cp ssl.crt test-site/api/
          cp ssl.key test-site/api/

          cd test-site
          npm ci

      - name: Generate BIT installation values
        working-directory: ${{ env.BIT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run setup:install

      - name: Generate BIT crypto values
        working-directory: ${{ env.BIT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run setup:crypto

      - name: Match BIT feature flags to Vaultwarden
        working-directory: ${{ env.BIT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          touch flags.json
          npm run setup:flags

      - name: Provision and seed Vaultwarden using BIT
        working-directory: ${{ env.BIT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # Prefer BIT's combined setup:vault command when available.
          # Current upstream CI uses the separate account and cipher
          # seeding commands, so retain that fallback.
          if node -e "
            const scripts = require('./package.json').scripts || {};
            process.exit(scripts['setup:vault'] ? 0 : 1);
          "; then
            npm run setup:vault
          else
            npm run seed:vault:account
            npm run seed:vault:ciphers
          fi

      - name: Run upstream BIT static tests
        working-directory: ${{ env.BIT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run test:static:ci

      - name: Add BIT test summary
        if: always()
        working-directory: ${{ env.BIT_DIR }}
        shell: bash
        run: |
          if [ -f test-summary/test-summary.md ]; then
            cat test-summary/test-summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          DIAGNOSTICS_DIR="${RUNNER_TEMP}/vaultwarden-lifecycle"
          mkdir -p "${DIAGNOSTICS_DIR}"

          docker ps -a \
            > "${DIAGNOSTICS_DIR}/docker-ps.txt" 2>&1

          docker logs "${VAULTWARDEN_CONTAINER}" \
            > "${DIAGNOSTICS_DIR}/vaultwarden.log" 2>&1

          sudo nginx -T \
            > "${DIAGNOSTICS_DIR}/nginx-config.txt" 2>&1

          sudo journalctl -u nginx --no-pager \
            > "${DIAGNOSTICS_DIR}/nginx-journal.txt" 2>&1

          curl -v \
            "${VAULTWARDEN_BASE_URL}/alive" \
            > "${DIAGNOSTICS_DIR}/https-alive.txt" 2>&1

          if [ -n "${BIT_COMMIT:-}" ]; then
            echo "${BIT_COMMIT}" \
              > "${DIAGNOSTICS_DIR}/bit-commit.txt"
          fi

      - name: Upload BIT results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vaultwarden-bit-results
          path: |
            ${{ runner.temp }}/vaultwarden-lifecycle/
            ${{ runner.temp }}/browser-interactions-testing/flags.json
            ${{ runner.temp }}/browser-interactions-testing/test-summary/
            ${{ runner.temp }}/browser-interactions-testing/tests-out/
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup ephemeral environment
        if: always()
        shell: bash
        run: |
          set +e

          VAULTWARDEN_TLS_DIR="${RUNNER_TEMP}/vaultwarden-tls"
          NSS_DB="${HOME}/.pki/nssdb"

          # Remove temporary Vaultwarden container.
          docker rm --force "${VAULTWARDEN_CONTAINER}" 2>/dev/null

          # Stop Nginx.
          sudo systemctl stop nginx 2>/dev/null

          # Remove temporary Nginx configuration.
          sudo rm -f \
            /etc/nginx/sites-enabled/vaultwarden-lifecycle \
            /etc/nginx/sites-available/vaultwarden-lifecycle

          # Remove temporary CA from system trust.
          sudo rm -f \
            /usr/local/share/ca-certificates/vaultwarden-lifecycle-ca.crt

          sudo update-ca-certificates

          # Remove temporary CA from Chromium NSS database.
          if [ -d "${NSS_DB}" ]; then
            certutil \
              -d "sql:${NSS_DB}" \
              -D \
              -n "Vaultwarden Lifecycle Test CA" \
              2>/dev/null || true
          fi

          # Remove temporary hostname entry.
          sudo sed -i \
            "/${VAULTWARDEN_HOSTNAME//./\\.}/d" \
            /etc/hosts

          # Remove temporary certificates and BIT checkout.
          rm -rf "${VAULTWARDEN_TLS_DIR}"
          rm -f "${RUNNER_TEMP}/ssl.crt" "${RUNNER_TEMP}/ssl.key"
          rm -rf "${RUNNER_TEMP}/browser-interactions-testing"

          echo "Temporary Vaultwarden and BIT environments cleaned up."
